name: TCS Mail 0.8.3 - native builds and installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcsmail-v083-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-24.04, kind: linux, rust_target: x86_64-unknown-linux-gnu }
          - { label: windows-x64, os: windows-2022, kind: windows, rust_target: x86_64-pc-windows-msvc }
          - { label: macos-intel, os: macos-15-intel, kind: mac_intel, rust_target: x86_64-apple-darwin }
          - { label: macos-arm64, os: macos-15, kind: mac_arm, rust_target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      CARGO_HOME: ${{ github.workspace }}/.build-v083/cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.build-v083/rustup-home
    steps:
      - name: Exact commit checkout without push credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf appstream rpm rpm2cpio cpio libarchive-tools libsecret-tools
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pinned Rust with native target, Rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tcsmail-v083-${{ matrix.rust_target }}
      - name: Install exact Tauri CLI
        run: cargo install tauri-cli --version '=2.12.4' --locked
      - name: Required source regressions, Rust gates, native packages and payload guard
        # The orchestrator runs rc8-bulk-delete-regression.mjs and behavioral
        # rc8fix1-bulk-behavior.mjs, test_utf8_ci_sources.py, v083-utf8.py,
        # all existing active RC7/RC2 gates, cargo fmt/check/test/Clippy --locked,
        # native DEB+RPM (Version 0.8.3, Release 1), EXE+MSI or APP+DMG, then package inspection.
        run: python scripts/build-0.8.3.py --target ${{ matrix.rust_target }}
      - name: Retain diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-0.8.3-${{ matrix.label }}-${{ github.run_number }}
          path: |
            .build-v083/**/result.json
            .build-v083/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload inspected installers, no Release publication
        uses: actions/upload-artifact@v7
        with:
          name: tcsmail-0.8.3-${{ matrix.label }}-${{ github.run_number }}
          path: delivery/${{ matrix.label }}/*
          if-no-files-found: error
          retention-days: 14
  summary:
    name: Four-target build result
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Record limits and require all four native jobs
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            echo '## TCS Mail 0.8.3'
            echo "Commit: ${GITHUB_SHA}"
            echo "Four native build jobs: ${BUILD_RESULT}"
            echo 'Installer checks do not replace native GUI/provider tests.'
            echo 'No release was published and no commit was pushed.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$BUILD_RESULT" = success
